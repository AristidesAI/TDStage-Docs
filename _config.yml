title: TDStage
description: Multi-phone LiDAR stage tracking. Operator and integrator documentation.
remote_theme: just-the-docs/just-the-docs

# just-the-docs options
color_scheme: dark
search_enabled: true
search:
  heading_level: 2
  previews: 2
heading_anchors: true

# Diagrams. just-the-docs renders ```mermaid fenced blocks when this is set;
# without it they fall back to plain code blocks, which is a silent failure
# rather than a visible one, so check a page after changing the version.
mermaid:
  version: "11.4.1"
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Issues (private)":
    - "https://github.com/AristidesAI/TDStage/issues"
  "Board (private)":
    - "https://github.com/users/AristidesAI/projects/1"
  "Source (private)":
    - "https://github.com/AristidesAI/TDStage"
aux_links_new_tab: true

footer_content: >-
  TDStage documentation. Operator and integrator reference.
  Figures are measured on the rig and dated; re-measure before quoting them.

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - README.md
  - .github/
