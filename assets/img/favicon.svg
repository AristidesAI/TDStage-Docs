<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TDStage">
  <!-- A depth scan: a figure resolved out of a point grid, which is what the
       system does. Reads at 16px as a bright shape on dark, which is all a
       favicon has to do. -->
  <rect width="64" height="64" rx="14" fill="#15171c"/>
  <g fill="#00ffe6">
    <!-- head -->
    <circle cx="32" cy="16" r="3.4"/>
    <!-- shoulders and torso, denser where a body would return more points -->
    <circle cx="24" cy="26" r="2.6"/><circle cx="32" cy="25" r="3"/><circle cx="40" cy="26" r="2.6"/>
    <circle cx="27" cy="34" r="2.8"/><circle cx="37" cy="34" r="2.8"/>
    <!-- arms -->
    <circle cx="17" cy="31" r="2.1"/><circle cx="47" cy="31" r="2.1"/>
    <!-- legs -->
    <circle cx="28" cy="44" r="2.6"/><circle cx="36" cy="44" r="2.6"/>
    <circle cx="27" cy="53" r="2.2"/><circle cx="37" cy="53" r="2.2"/>
  </g>
  <!-- the floor plane the stage box sits on -->
  <g fill="#00ffe6" opacity="0.35">
    <circle cx="14" cy="57" r="1.5"/><circle cx="24" cy="58" r="1.5"/>
    <circle cx="32" cy="58.5" r="1.5"/><circle cx="40" cy="58" r="1.5"/>
    <circle cx="50" cy="57" r="1.5"/>
  </g>
</svg>
